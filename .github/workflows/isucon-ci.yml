name: PR EC2 Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    # AWS credentials must never be handed to code from a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_REGION: ap-northeast-1
      AMI_ID: ${{ vars.EC2_AMI_ID }}
      SUBNET_ID: ${{ vars.EC2_SUBNET_ID }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check configuration
        env:
          ROLE_ARN: ${{ vars.AWS_EC2_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in ROLE_ARN AMI_ID SUBNET_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done

      - name: Check out the PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EC2_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create temporary SSH security group
        id: security_group
        run: |
          set -euo pipefail
          vpc_id=$(aws ec2 describe-subnets --subnet-ids "$SUBNET_ID" --query 'Subnets[0].VpcId' --output text)
          group_id=$(aws ec2 create-security-group \
            --group-name "pr-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --description "Temporary SSH access for GitHub Actions run ${GITHUB_RUN_ID}" \
            --vpc-id "$vpc_id" --query GroupId --output text)
          echo "id=$group_id" >> "$GITHUB_OUTPUT"
          runner_ip=$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')
          aws ec2 authorize-security-group-ingress \
            --group-id "$group_id" --protocol tcp --port 22 --cidr "${runner_ip}/32"

      - name: Start EC2
        id: instance
        env:
          GROUP_ID: ${{ steps.security_group.outputs.id }}
        run: |
          set -euo pipefail
          instance_id=$(aws ec2 run-instances \
            --image-id "$AMI_ID" --instance-type c5.large \
            --network-interfaces "DeviceIndex=0,SubnetId=${SUBNET_ID},Groups=${GROUP_ID},AssociatePublicIpAddress=true" \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"DeleteOnTermination":true}}]' \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=isucon14-pr-${GITHUB_RUN_ID}}]" \
            --query 'Instances[0].InstanceId' --output text)
          echo "id=$instance_id" >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-status-ok --instance-ids "$instance_id"
          public_ip=$(aws ec2 describe-instances --instance-ids "$instance_id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ -z "$public_ip" ] || [ "$public_ip" = None ]; then
            echo 'EC2 has no public IP address' >&2
            exit 1
          fi
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"

      - name: SSH into EC2
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          PUBLIC_IP: ${{ steps.instance.outputs.public_ip }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_key"
          ssh-keygen -q -t ed25519 -N '' -f "$key_file"
          for attempt in {1..12}; do
            # EC2 Instance Connect accepts this public key for 60 seconds.
            aws ec2-instance-connect send-ssh-public-key \
              --instance-id "$INSTANCE_ID" --instance-os-user ubuntu \
              --ssh-public-key "file://${key_file}.pub" > /dev/null
            if ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/ec2_known_hosts" \
              "ubuntu@$PUBLIC_IP" 'echo "SSH connected"; uname -a'; then
              exit 0
            fi
            sleep 10
          done
          echo 'SSH connection failed' >&2
          exit 1

      - name: Transfer PR source and run benchmark on EC2
        id: benchmark
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          PUBLIC_IP: ${{ steps.instance.outputs.public_ip }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2_key"
          ssh_options=(-i "$key_file" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ec2_known_hosts")

          # The checkout is pinned to the PR head SHA. Do not clone a moving branch on EC2.
          tar -czf "$RUNNER_TEMP/pr-source.tar.gz" webapp/go bench
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" --instance-os-user ubuntu \
            --ssh-public-key "file://${key_file}.pub" > /dev/null
          scp "${ssh_options[@]}" "$RUNNER_TEMP/pr-source.tar.gz" \
            "ubuntu@$PUBLIC_IP:/tmp/pr-source.tar.gz"

          # Instance Connect keys expire after 60 seconds; register it again for this session.
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" --instance-os-user ubuntu \
            --ssh-public-key "file://${key_file}.pub" > /dev/null
          ssh "${ssh_options[@]}" "ubuntu@$PUBLIC_IP" 'sudo bash -se' <<'REMOTE' | tee "$RUNNER_TEMP/benchmark.log"
          systemctl stop isuride-matcher
          systemctl stop isuride-go
          rm -rf /home/isucon/webapp/go /home/isucon/bench
          sudo -u isucon tar -xzf /tmp/pr-source.tar.gz -C /home/isucon
          sudo -u isucon bash -se <<'BUILD'
          cd /home/isucon/webapp/go
          /home/isucon/local/golang/bin/go build -o isuride -ldflags '-s -w' .
          cd /home/isucon/bench
          /home/isucon/local/golang/bin/go build -o benchmark -ldflags '-s -w' .
          BUILD
          systemctl restart isuride-go
          systemctl is-active --quiet isuride-go
          # The AMI's 2024 HTTPS certificate has expired. Matching is a local API.
          mkdir -p /etc/systemd/system/isuride-matcher.service.d
          cat > /etc/systemd/system/isuride-matcher.service.d/ci.conf <<'MATCHER'
          [Service]
          ExecStart=
          ExecStart=/bin/sh -c "while true; do curl -fsS http://127.0.0.1:8080/api/internal/matching >/dev/null; sleep $ISUCON_MATCHING_INTERVAL; done"
          MATCHER
          systemctl daemon-reload
          systemctl restart isuride-matcher
          systemctl is-active --quiet isuride-matcher
          curl -fsS http://127.0.0.1:8080/api/internal/matching > /dev/null
          # The AMI's mock payment service uses port 12345; the benchmark owns it.
          systemctl stop isuride-payment_mock
          cd /home/isucon/bench
          sudo -u isucon ./benchmark run \
            --target http://127.0.0.1:8080 \
            --payment-url http://127.0.0.1:12345 \
            --skip-static-sanity-check --fail-on-error -t 60
          REMOTE

          # The benchmark can report pass=false without a nonzero process exit.
          grep -Fq 'msg=結果 pass=true' "$RUNNER_TEMP/benchmark.log"

      - name: Summarize benchmark
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          set -euo pipefail
          score='—'
          if [ -f "$RUNNER_TEMP/benchmark.log" ]; then
            found=$(sed -n 's/.*msg=結果 pass=[a-z]* スコア=\([0-9][0-9]*\).*/\1/p' \
              "$RUNNER_TEMP/benchmark.log" | tail -n 1)
            score="${found:-—}"
          fi
          if [ "$BENCHMARK_OUTCOME" = success ]; then
            result=成功
          else
            result=失敗
          fi
          printf -- '- 結果: **%s**\n- スコア: **%s**\n' "$result" "$score" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove EC2 and security group
        if: always()
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          GROUP_ID: ${{ steps.security_group.outputs.id }}
        run: |
          set -euo pipefail
          if [ -n "$INSTANCE_ID" ]; then
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-terminated --instance-ids "$INSTANCE_ID"
          fi
          if [ -n "$GROUP_ID" ]; then
            aws ec2 delete-security-group --group-id "$GROUP_ID"
          fi
